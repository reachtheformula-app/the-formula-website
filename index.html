<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Formula - Modern tools for exceptional childcare. Structured, educational care right at home. Daily plans for caregivers. Detailed updates for parents." />
    <title>The Formula | Modern Childcare Tools</title>
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Formula | Modern Childcare Tools" />
    <meta property="og:description" content="Structured, educational care right at home. Daily plans for caregivers. Detailed updates for parents." />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Formula | Modern Childcare Tools" />
    <meta name="twitter:description" content="Structured, educational care right at home. Daily plans for caregivers. Detailed updates for parents." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
<body>
  <!-- Hidden forms for Netlify detection -->
  <form name="have-a-caregiver" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="parentName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="childrenAges" />
    <input type="text" name="nannyName" />
    <input type="email" name="nannyEmail" />
    <input type="text" name="bot-field" />
  </form>
  <form name="looking-for-caregiver" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="parentName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="location" />
    <input type="text" name="childrenAges" />
    <input type="text" name="careType" />
    <input type="text" name="schedule" />
    <input type="text" name="startDate" />
    <textarea name="aboutFamily"></textarea>
    <textarea name="whatLookingFor"></textarea>
    <input type="text" name="bot-field" />
  </form>
    <form name="caregiver-application" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="firstName" />
    <input type="text" name="lastName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="location" />
    <input type="text" name="experience" />
    <input type="text" name="certifications" />
    <input type="text" name="availability" />
    <textarea name="aboutYou"></textarea>
    <textarea name="whyFormula"></textarea>
    <input type="text" name="bot-field" />
  </form>

  <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
